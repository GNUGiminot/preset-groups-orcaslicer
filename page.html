<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preset Groups</title>
<style>
:root{
  --bg:var(--orca-bg,#f4f5f7);--fg:var(--orca-fg,#1b2127);--muted:var(--orca-muted,#6b7580);--line:var(--orca-border,#dadfe4);
  --accent:var(--orca-accent,#009688);--accent-fg:var(--orca-accent-fg,#fff);
  --surface:color-mix(in srgb,var(--fg) 2.5%,var(--bg));--surface-2:color-mix(in srgb,var(--fg) 6%,var(--bg));
  --raised:color-mix(in srgb,#fff 62%,var(--bg));--accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --accent-line:color-mix(in srgb,var(--accent) 45%,var(--line));
  --warn:#b86e00;--warn-soft:color-mix(in srgb,#f59e0b 16%,transparent);--danger:#cf3f3f;--spool:#7c4dd6;--spool-soft:color-mix(in srgb,#7c4dd6 13%,transparent);
  --shadow:0 1px 2px rgb(16 24 32/.06),0 12px 30px -18px rgb(16 24 32/.32);--shadow-lg:0 30px 70px -24px rgb(10 16 24/.45);
  --r:12px;--r-sm:8px;
  --logo-bg:#0f1b2d;--logo-a:#2dd4bf;--logo-b:#6366f1;--logo-c:#818cf8;--logo-dot:#fbbf24;
  font:13px/1.45 var(--orca-font,system-ui,'Segoe UI',sans-serif);color-scheme:light dark}
/* Themes of the plugin's own: "warm" (light) and "night" (warm dark). Without one the page takes Orca's colours. */
:root[data-pg-theme=warm]{--bg:#f7f1e9;--fg:#2e251f;--muted:#857160;--line:#e6dacb;--accent:#b4552a;--accent-fg:#fff;--raised:#fffcf7;
  --surface:#f2eadf;--surface-2:#ebe0d2;--warn:#a85d00;--danger:#c2410c;--spool:#8a4fc4;
  --logo-bg:#3b2a21;--logo-a:#fbbf24;--logo-b:#ea580c;--logo-c:#fb923c;--logo-dot:#fde68a;color-scheme:light}
:root[data-pg-theme=night]{--bg:#1c1815;--fg:#f0e6da;--muted:#a8968a;--line:#3a312a;--accent:#e9935c;--accent-fg:#22180f;
  --logo-bg:#2b211b;--logo-a:#fbbf24;--logo-b:#ea580c;--logo-c:#fb923c;--logo-dot:#fde68a}
:root[data-orca-theme=dark]:not([data-pg-theme=warm]),:root[data-pg-theme=night]{--raised:color-mix(in srgb,#fff 5%,var(--bg));--surface:color-mix(in srgb,#fff 2.5%,var(--bg));--surface-2:color-mix(in srgb,#fff 7%,var(--bg));
  --warn:#f5b041;--danger:#ff7b7b;--spool:#b49bff;--shadow:0 1px 2px rgb(0 0 0/.35),0 14px 34px -18px rgb(0 0 0/.8);--shadow-lg:0 30px 70px -20px rgb(0 0 0/.8);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}
/* Orca adds html/body/heading colours after this sheet; these selectors outrank them so a theme of the plugin wins. */
:root{background:var(--bg)}
html body{margin:0;background:var(--bg);color:var(--fg);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
body h1,body h2,body h3,body h4{color:var(--fg)}
:root ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 18%,transparent);border-radius:6px}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Orca injects default button/input styles after this sheet, so base rules use "body …" to outrank them. */
body button{font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,color .15s,transform .05s}
body button:hover:not(:disabled){border-color:var(--accent-line);background:color-mix(in srgb,var(--accent) 6%,var(--raised))}
body button:active:not(:disabled){transform:translateY(1px)}body button:disabled{opacity:.45;cursor:default}
body button.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
body button.primary:hover:not(:disabled){background:color-mix(in srgb,#fff 10%,var(--accent))}
body button.ghost{background:transparent;border-color:transparent;color:var(--muted)}body button.ghost:hover:not(:disabled){color:var(--fg);background:var(--surface-2);border-color:transparent}
body button.icon{width:32px;padding:0}body button.sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}body button.sm.icon{width:26px;padding:0}
body button.danger{color:var(--danger)}
body input,body select,body textarea{font:inherit;color:var(--fg);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);height:32px;padding:0 10px;min-width:0}
body textarea{height:auto;padding:8px 10px;resize:vertical;width:100%;line-height:1.45}
body input:focus,body select:focus,body textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
body input[type=checkbox]{height:auto;width:auto;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
/* app bar */
.appbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 10%,var(--bg)),var(--bg) 48%);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 6px 10px color-mix(in srgb,var(--accent) 35%,transparent))}
.brand h1{margin:0;font-size:15px;line-height:1.15;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.brand .sub .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.kinds{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);margin-left:auto}
body .kinds button{height:30px;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:0 12px;gap:7px}
body .kinds button:hover:not(:disabled){background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--fg)}
body .kinds button[aria-pressed=true]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.12),0 0 0 1px var(--line)}
.kinds .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:20px;padding:0 6px;line-height:17px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:9px;color:var(--muted);pointer-events:none}
body .search input{padding-left:31px;width:230px;padding-right:28px}
.search kbd{position:absolute;right:8px;font:11px var(--orca-font,system-ui);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:16px;pointer-events:none}
/* layout */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:0}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:12px 10px 14px;display:flex;flex-direction:column;gap:2px}
.side h3{display:flex;align-items:center;justify-content:space-between;margin:14px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;padding:0 8px 0 9px;height:34px;border-radius:9px;cursor:pointer;color:var(--fg);position:relative;user-select:none;border:1px solid transparent}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--raised);border-color:var(--line);box-shadow:0 1px 2px rgb(0 0 0/.06)}
.nav.on::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gc,var(--accent))}
.nav .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .count.warn{color:var(--warn);font-weight:600}.nav .count.spool{color:var(--spool);font-weight:600}
.nav .gdot{width:10px;height:10px;border-radius:4px;background:var(--gc);flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0/.12)}
.nav .menu-btn{opacity:0;margin-right:-4px}.nav:hover .menu-btn,.nav.on .menu-btn{opacity:1}
.nav.drop{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.nav.drag-over-top{box-shadow:inset 0 2px 0 var(--accent)}
.nav.dragging{opacity:.4}
.side .hint{margin:auto 6px 0;padding:12px 10px 2px;font-size:11.5px;color:var(--muted);display:flex;gap:8px;border-top:1px solid var(--line)}
.side .hint svg{flex:none;margin-top:1px}
.empty-groups{margin:4px 6px;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px;text-align:center}
.empty-groups button{margin-top:8px}
main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px 10px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:17px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px;min-width:0}
.toolbar h2 .gdot{width:12px;height:12px;border-radius:4px;background:var(--gc)}
.toolbar h2 .c{font-size:12px;color:var(--muted);font-weight:500}
.toolbar .spacer{flex:1}
.toolbar label.f{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
body .toolbar select{height:30px;font-size:12.5px}
.scroll{overflow:auto;padding:0 18px 90px;min-height:0}
/* sections */
.section{margin:8px 0 16px}
.sec-head{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 2px;position:sticky;top:0;z-index:2;background:var(--bg);cursor:pointer;user-select:none}
.sec-head .bar{width:4px;height:18px;border-radius:3px;background:var(--gc,var(--line))}
.sec-head .t{font-weight:600;font-size:13.5px}
.sec-head .c{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sec-head .chev{color:var(--muted);transition:transform .2s}
.section.closed .chev{transform:rotate(-90deg)}.section.closed .rows{display:none}
.sec-head .line{flex:1;height:1px;background:var(--line)}
.section.drop .rows{outline:2px dashed var(--accent);outline-offset:3px;border-radius:12px}
.rows{display:flex;flex-direction:column;gap:6px}
.rows.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px;text-align:center}
/* preset row */
.row{display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:9px 10px 9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);box-shadow:0 1px 1px rgb(0 0 0/.03);cursor:default;transition:border-color .15s,box-shadow .15s,background .15s;position:relative}
.row:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:var(--shadow)}
.row.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--raised));box-shadow:0 0 0 1px var(--accent) inset}
.row.off{opacity:.62}
.row.dragging{opacity:.45}
.row .check{width:18px;height:18px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--fg) 28%,transparent);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s,background .15s;background:var(--raised)}
.row:hover .check,.row.sel .check,body.selecting .row .check{opacity:1}
.row.sel .check{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.row .check svg{width:12px;height:12px;stroke-width:3;opacity:0}.row.sel .check svg{opacity:1}
.swatch{width:34px;height:34px;border-radius:50%;position:relative;background:var(--sw,#9aa3ab);box-shadow:inset 0 0 0 1px rgb(0 0 0/.14),inset 0 -6px 10px -4px rgb(0 0 0/.25),inset 0 5px 8px -5px rgb(255 255 255/.55)}
.swatch::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgb(0 0 0/.25)}
:root[data-orca-theme=dark]:not([data-pg-theme=warm]) .swatch,:root[data-pg-theme=night] .swatch{box-shadow:0 0 0 1px rgb(255 255 255/.16),inset 0 -6px 10px -4px rgb(0 0 0/.3),inset 0 5px 8px -5px rgb(255 255 255/.45)}
.swatch.none{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,var(--line) 5px 7px)}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile svg{width:19px;height:19px}
.info{min-width:0}
.info .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.info .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.info .meta .sep{opacity:.5}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.fact{font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--surface-2);border-radius:7px;padding:2px 7px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.fact svg{width:12px;height:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;border-radius:20px;padding:1px 8px;white-space:nowrap;line-height:18px}
.badge.slot{background:var(--accent-soft);color:var(--accent)}
.badge.spool{background:var(--spool-soft);color:var(--spool)}
.badge.dup{background:var(--warn-soft);color:var(--warn)}
.badge.type{background:var(--surface-2);color:var(--fg);font-weight:600}
.badge.gtag{background:color-mix(in srgb,var(--gc) 14%,transparent);color:color-mix(in srgb,var(--gc) 75%,var(--fg))}
.actions{display:flex;gap:4px;opacity:.0;transition:opacity .15s}
.row:hover .actions,.row:focus-within .actions{opacity:1}
/* duplicates */
.dup-intro{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);margin:4px 0 14px;align-items:flex-start}
.dup-intro svg{color:var(--warn);width:20px;height:20px;margin-top:1px}
.cluster{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.cluster header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--raised)}
.cluster header .why{font-weight:600}
.cluster header .spacer{flex:1}
.cluster .members{display:flex;flex-direction:column;gap:6px;padding:10px}
.cluster .members .row{grid-template-columns:34px minmax(0,1fr) auto auto}
.diff{margin:0 10px 10px;border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--raised)}
.diff table{border-collapse:collapse;width:100%;font-size:12px}
.diff th,.diff td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.diff tr:last-child td{border-bottom:0}.diff th{color:var(--muted);font-weight:600;background:var(--surface)}
.diff td.k{font-family:ui-monospace,Consolas,monospace;color:var(--muted)}
/* empty states */
.empty{display:grid;place-items:center;text-align:center;padding:60px 20px;color:var(--muted)}
.empty .art{width:150px;height:110px;margin-bottom:10px}
.empty h4{margin:0 0 4px;color:var(--fg);font-size:14.5px}
.empty p{margin:0 0 14px;max-width:380px}
/* selection bar */
.selbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);display:flex;flex-wrap:wrap;max-width:calc(100vw - 24px);align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:14px;background:color-mix(in srgb,var(--fg) 90%,var(--bg));color:var(--bg);box-shadow:var(--shadow-lg);transition:transform .25s cubic-bezier(.2,.9,.3,1.2);z-index:20}
.selbar:not(.show){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.selbar.show{transform:translate(-50%,0)}
.selbar .n{font-weight:600;margin-right:6px;white-space:nowrap}
body .selbar button{background:color-mix(in srgb,var(--bg) 12%,transparent);border-color:transparent;color:var(--bg)}
body .selbar button:hover:not(:disabled){background:color-mix(in srgb,var(--bg) 22%,transparent);border-color:transparent}
body .selbar button.primary{background:var(--accent);color:var(--accent-fg)}
/* popover menu */
.pop{position:fixed;z-index:50;min-width:210px;max-width:320px;max-height:60vh;overflow:auto;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.pop .mi{display:flex;align-items:center;gap:9px;padding:0 10px;height:32px;border-radius:8px;cursor:pointer;white-space:nowrap}
.pop .mi:hover,.pop .mi:focus{background:var(--surface-2);outline:none}
.pop .mi .gdot{width:10px;height:10px;border-radius:4px;background:var(--gc);flex:none}
.pop .mi .sw{width:14px;height:14px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgb(0 0 0/.15);flex:none}
.pop .mi .grow{flex:1;overflow:hidden;text-overflow:ellipsis}
.pop .mi .k{color:var(--muted);font-size:11.5px}
.pop .mi.cur{color:var(--accent);font-weight:600}
.pop .mi.danger{color:var(--danger)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.pop .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px;font-weight:600}
/* dialog */
.scrim{position:fixed;inset:0;background:rgb(10 14 20/.38);display:grid;place-items:center;z-index:60;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dialog{outline:none;width:min(420px,100%);background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:20px;animation:pop .18s ease-out}
.dialog h3{margin:0 0 4px;font-size:16px}.dialog p{margin:0 0 14px;color:var(--muted)}
body .dialog input{width:100%;height:36px;font-size:14px}
.palette{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
.palette button{width:30px;height:30px;padding:0;border-radius:9px;background:var(--c)!important;border:0!important;box-shadow:inset 0 0 0 1px rgb(0 0 0/.12)}
.palette button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.dialog .btns{display:flex;justify-content:flex-end;gap:8px}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:-24px 0 50px -30px rgb(0 0 0/.55);transform:translateX(104%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr)}
.drawer.open{transform:none}
.drawer .head{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--sw,var(--accent)) 16%,var(--bg)),var(--bg) 70%)}
.drawer .head .swatch,.drawer .head .tile{width:48px;height:48px}.drawer .head .swatch::after{inset:16px}
.drawer .head h3{margin:0;font-size:15.5px;word-break:break-word}
.drawer .head .meta{color:var(--muted);font-size:12px;margin-top:2px}
.drawer .body{overflow:auto;padding:16px 18px 30px}
.drawer h4{margin:18px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--muted)}.kv b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.drawer .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.plist span{background:var(--surface-2);border-radius:7px;padding:2px 8px;font-size:12px}
/* toast */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--raised);border:1px solid var(--line);box-shadow:var(--shadow-lg);max-width:380px;animation:pop .2s ease-out}
.toast.ok svg{color:var(--accent)}.toast.error svg{color:var(--danger)}.toast.warn svg{color:var(--warn)}
.toast button{margin-left:6px}
.loading{display:grid;place-items:center;height:100%;color:var(--muted);gap:10px}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* new presets, health, favourites, notes */
.nav .count.new{color:var(--accent-fg);background:var(--accent);border-radius:20px;padding:0 7px;font-weight:600;line-height:18px}

<script>
"use strict";
/* PURE:BEGIN - no DOM in this part: tests/test_presetgroups.py runs it in Node. */
const KINDS=["filament","printer","process"];
function lower(s){return String(s??"").toLowerCase()}
function vendorKey(s){return lower(s).replace(/[\s._-]+/g,"")}
function ruleParts(text){return lower(text).split(",").map(x=>x.trim()).filter(Boolean)}
/* A group rule matches a preset when every field that is set matches; a field with commas
   matches any of its parts. type and vendor must be equal (vendor in any spelling), the others
   are parts of the text. */
function ruleMatches(rule,p){
  const keys=Object.keys(rule||{}).filter(k=>String(rule[k]||"").trim());
  if(!keys.length)return false;
  const f=p.facts||{};
  for(const k of keys){
    const want=ruleParts(rule[k]);
    if(k==="type"&&!want.includes(lower(f.type)))return false;
    if(k==="vendor"&&!want.map(vendorKey).includes(vendorKey(f.vendor)))return false;
    if(k==="model"&&!want.some(w=>lower(f.model).includes(w)))return false;
    if(k==="printer"){const ps=(p.kind==="printer"?[p.parent,p.label]:p.printers||[]).map(lower);if(!want.some(w=>ps.some(x=>x.includes(w))))return false}
    if(k==="text"&&!want.some(w=>lower(p.label).includes(w)))return false;
  }
  return true;
}
/* name -> group id. A preset put into a group by hand stays there; the others go to the first
   group whose rule matches them, unless they were taken out of that group by hand. */
function membership(groups,list){
  const m=new Map();
  for(const g of groups)for(const n of g.items)if(!m.has(n))m.set(n,g.id);
  for(const p of list){
    if(m.has(p.name))continue;
    for(const g of groups){if((g.excluded||[]).includes(p.name))continue;if(ruleMatches(g.rule,p)){m.set(p.name,g.id);break}}
  }
  return m;
}
function favoritesFirst(list,fav){return list.filter(p=>fav.has(p.name)).concat(list.filter(p=>!fav.has(p.name)))}
function exportConfig(cfg,version,date){
  return {format:"preset-groups",format_version:1,plugin_version:version,exported:date,
    groups:cfg.groups,favorites:cfg.favorites,notes:cfg.notes,hidden:cfg.hidden,not_duplicates:cfg.not_duplicates,favorites_first:cfg.favorites_first};
}
function parseImport(text){
  const o=JSON.parse(text);
  if(!o||typeof o!=="object"||o.format!=="preset-groups"||typeof o.groups!=="object"||!o.groups)throw new Error("format");
  return o;
}
function importSummary(o){
  const n=key=>KINDS.reduce((a,k)=>a+(Array.isArray(o[key]&&o[key][k])?o[key][k].length:0),0);
  return {groups:n("groups"),favorites:n("favorites"),hidden:n("hidden"),
    notes:KINDS.reduce((a,k)=>a+Object.keys((o.notes&&o.notes[k])||{}).length,0)};
}
/* "replace" takes the imported groups, favourites, notes and hidden presets instead of the
   current ones; "merge" adds them: groups of the same name are joined, and a preset already in a
   group of its own stays there. The plugin cleans the result when it is saved. */
function mergeImport(cfg,inc,mode){
  const out=JSON.parse(JSON.stringify(cfg));
  const lists=["hidden","favorites","not_duplicates"];
  for(const k of KINDS){
    const groupsIn=Array.isArray(inc.groups[k])?inc.groups[k].filter(g=>g&&typeof g==="object"):[];
    const listIn=key=>Array.isArray(inc[key]&&inc[key][k])?inc[key][k].map(String):[];
    const notesIn=inc.notes&&inc.notes[k]&&typeof inc.notes[k]==="object"?inc.notes[k]:{};
    if(mode==="replace"){
      out.groups[k]=groupsIn.map(g=>JSON.parse(JSON.stringify(g)));
      for(const key of lists)out[key][k]=listIn(key);
      out.notes[k]={...notesIn};
      continue;
    }
    const taken=new Set(out.groups[k].flatMap(g=>g.items));
    for(const g of groupsIn){
      const name=String(g.name||"").replace(/\s+/g," ").trim();if(!name)continue;
      const items=(Array.isArray(g.items)?g.items:[]).map(String).filter(n=>!taken.has(n));
      items.forEach(n=>taken.add(n));
      const excluded=(Array.isArray(g.excluded)?g.excluded:[]).map(String);
      const mine=out.groups[k].find(x=>lower(x.name)===lower(name));
      if(mine){
        mine.items.push(...items);
        if(!Object.keys(mine.rule||{}).length&&g.rule)mine.rule={...g.rule};
        mine.excluded=[...new Set([...(mine.excluded||[]),...excluded])];
      }else{
        const ids=new Set(out.groups[k].map(x=>x.id));
        const id=g.id&&!ids.has(String(g.id))?String(g.id):"g"+Math.random().toString(36).slice(2,10);
        out.groups[k].push({id,name,color:g.color,items,collapsed:!!g.collapsed,rule:g.rule&&typeof g.rule==="object"?{...g.rule}:{},excluded});
      }
    }
    for(const key of lists)out[key][k]=[...new Set([...out[key][k],...listIn(key)])];
    for(const [n,v] of Object.entries(notesIn))if(!out.notes[k][n]&&String(v??"").trim())out.notes[k][n]=String(v);
  }
  return out;
}

let T={},LANG="en",DATA=null,CFG=null,MEMO=null;

const t=(k,v={})=>String(T[k]??k).replace(/\{(\w+)\}/g,(m,n)=>v[n]??m);

/* ---------- derived data ---------- */
const groups=()=>CFG.groups[S.kind];
const hidden=()=>new Set(CFG.hidden[S.kind]);
const favs=()=>new Set(CFG.favorites[S.kind]);
const seen=()=>new Set(CFG.seen[S.kind]);
const notes=()=>CFG.notes[S.kind];
const presets=()=>(DATA&&DATA.kinds[S.kind])||[];
function members(){if(!MEMO)MEMO=membership(groups(),presets());return MEMO}
function groupOf(name){const id=members().get(name);return id?groups().find(g=>g.id===id):null}
function hasRule(g){return Object.keys(g.rule||{}).length>0}
function dupNames(){const s=new Set();for(const c of DATA.duplicates[S.kind]||[])c.names.forEach(n=>s.add(n));return s}
function printerOk(p){
  if(S.kind==="printer"||S.printer==="all")return true;
  if(S.printer==="current")return p.compatible;
  return !p.printers.length||p.printers.includes(S.printer);
}
function matches(p){
  if(!S.q)return true;
  const g=groupOf(p.name),f=p.facts||{};
  const hay=[p.label,p.parent,g&&g.name,f.type,f.vendor,f.model,notes()[p.name],p.source==="pipspool"?"pipspool":""].join(" ").toLowerCase();
  return S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function sorted(list){
  const by={name:p=>p.label.toLowerCase(),type:p=>((p.facts.type||p.facts.model||p.facts.layer||"~")+" "+p.label).toLowerCase(),vendor:p=>((p.facts.vendor||"~")+" "+p.label).toLowerCase()}[S.sort]||(p=>p.label.toLowerCase());

}
function visible({includeHidden=false}={}){

}
function counts(){
  const h=hidden(),list=presets().filter(p=>!h.has(p.name)&&printerOk(p)),m=members(),f=favs(),sn=seen();
  return {all:list.length,none:list.filter(p=>!m.has(p.name)).length,
    group:g=>list.filter(p=>m.get(p.name)===g.id).length,
    dup:(DATA.duplicates[S.kind]||[]).filter(c=>c.names.some(n=>!h.has(n))).length,
    spool:list.filter(p=>p.source==="pipspool").length,hidden:presets().filter(p=>h.has(p.name)).length,
    fresh:presets().filter(p=>!h.has(p.name)&&!sn.has(p.name)).length,fav:list.filter(p=>f.has(p.name)).length,
    bad:presets().filter(p=>!h.has(p.name)&&(p.issues||[]).length).length,dupNames:dupNames()};
}

/* ---------- saving ---------- */
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>send("save_config",{config:CFG}),250)}
function saveNow(extra={}){clearTimeout(saveTimer);send("save_config",{config:CFG,...extra})}
function markSeen(names){const s=seen();let changed=false;for(const n of names)if(!s.has(n)){CFG.seen[S.kind].push(n);changed=true}return changed}
function initSeen(){
  if(CFG.seen_ready)return;
  // The first time the plugin opens, every preset that exists counts as seen.
  for(const k of KINDS)CFG.seen[k]=(DATA.kinds[k]||[]).map(p=>p.name);
  CFG.seen_ready=true;save();
}
function assign(names,gid){
  const before=groups().map(g=>[g,g.items.slice(),(g.excluded||[]).slice()]);
  const seenBefore=CFG.seen[S.kind].slice();
  const byName=new Map(presets().map(p=>[p.name,p]));
  for(const g of groups()){g.items=g.items.filter(n=>!names.includes(n));g.excluded=g.excluded||[]}
  const g=groups().find(x=>x.id===gid);
  if(g){g.items.push(...names);g.excluded=g.excluded.filter(n=>!names.includes(n))}
  else{
    // Taken out of every group: a rule must not put it back.
    for(const n of names){const p=byName.get(n);if(p)for(const x of groups())if(ruleMatches(x.rule,p)&&!x.excluded.includes(n))x.excluded.push(n)}
  }
  markSeen(names);
  S.sel.clear();save();render();
  const msg=g?t("msg.moved",{n:plural("n.presets",names.length),group:g.name}):t("msg.ungrouped",{n:plural("n.presets",names.length)});
  toast(msg,"ok",()=>{for(const [x,items,excluded] of before){x.items=items;x.excluded=excluded}CFG.seen[S.kind]=seenBefore;save();render()});
}
function setHidden(names,on){
  const h=new Set(CFG.hidden[S.kind]);names.forEach(n=>on?h.add(n):h.delete(n));CFG.hidden[S.kind]=[...h];
  if(on)markSeen(names);
  names.forEach(n=>S.sel.delete(n));save();render();
  toast(on?t("msg.hidden",{n:plural("n.presets",names.length)}):t("msg.shown",{n:plural("n.presets",names.length)}),"ok",()=>setHidden(names,!on));
}
function toggleFav(name){
  const f=favs(),on=!f.has(name);
  CFG.favorites[S.kind]=on?[...CFG.favorites[S.kind],name]:CFG.favorites[S.kind].filter(n=>n!==name);
  if(on)markSeen([name]);
  save();render();toast(t(on?"msg.fav":"msg.unfav"),"ok");
}
function markAllSeen(){
  const names=rowsForView().map(p=>p.name);if(!names.length)return;
  const before=CFG.seen[S.kind].slice();markSeen(names);save();render();
  toast(t("msg.seen",{n:plural("n.presets",names.length)}),"ok",()=>{CFG.seen[S.kind]=before;save();render()});
}
function newId(){return "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- rendering ---------- */

function navItem(id,icon,label,count,cls="",extra=""){

const VIEWS=["all","none","new","fav","dups","spool","health","hidden"];
const ANY_PRINTER_VIEWS=["new","health","hidden","dups"];
function viewTitle(){

  const ss=$("#sortSel");if(![...ss.options].some(o=>o.value===S.sort))S.sort="name";ss.value=S.sort;

function rowsForView(){
  const h=hidden();
  if(S.view==="hidden")return sorted(presets().filter(p=>h.has(p.name)&&matches(p)));
  if(S.view==="new"){const sn=seen();return sorted(presets().filter(p=>!h.has(p.name)&&!sn.has(p.name)&&matches(p)))}
  if(S.view==="health")return sorted(presets().filter(p=>!h.has(p.name)&&(p.issues||[]).length&&matches(p)));
  let list=visible();
  if(S.view==="none"){const m=members();list=list.filter(p=>!m.has(p.name))}
  else if(S.view==="spool")list=list.filter(p=>p.source==="pipspool");
  else if(S.view==="fav"){const f=favs();list=list.filter(p=>f.has(p.name))}

function swatch(p){

}
function metaLine(p){
  const f=p.facts,bits=[];

  else if(p.kind==="printer"){bits.push(esc(p.parent||f.model||""));if(f.nozzle)bits.push(esc(f.nozzle)+" "+esc(t("u.mm")));if(f.area)bits.push(esc(f.area))}

function issueText(p,issue){

}
function factChips(p){
  const f=p.facts,c=[];

    if(f.nozzle)c.push(`<span class="fact" title="${esc(t("f.nozzle"))}">${IC.temp}${esc(f.nozzle)}°</span>`);
    if(f.bed)c.push(`<span class="fact" title="${esc(t("f.bed"))}">${IC.bed}${esc(f.bed)}°</span>`);
    if(f.speed)c.push(`<span class="fact" title="${esc(t("f.speed"))}">${IC.flow}${esc(+(+f.speed).toFixed(1))} ${esc(t("u.mm3s"))}</span>`);
  }else if(p.kind==="process"){
    if(f.layer)c.push(`<span class="fact" title="${esc(t("f.layer"))}">${IC.layers}${esc(f.layer)} ${esc(t("u.mm"))}</span>`);
    if(f.walls)c.push(`<span class="fact" title="${esc(t("f.walls"))}">${esc(plural("n.walls",+f.walls))}</span>`);

function badges(p,dups){

    const ws=lower(q).split(/\s+/).filter(Boolean);
    const list=others.filter(p=>ws.every(w=>lower(p.label+" "+(p.facts.type||"")+" "+(p.facts.vendor||"")).includes(w)));
    dlg.el.querySelector("#pickList").innerHTML=list.map(p=>`<div class="mi" tabindex="0" data-n="${esc(p.name)}">${p.kind==="filament"?`<span class="sw" style="--sw:${esc((p.facts.color||"#9aa3ab").slice(0,7))}"></span>`:IC.layers}<span class="grow">${esc(p.label)}</span><span class="k">${esc(p.facts.type||p.facts.model||p.facts.layer||"")}</span></div>`).join("")||`<p class="muted">${esc(t("empty.filtered_title"))}</p>`;
  };
  draw("");
  const q=dlg.el.querySelector("#pickQ");setTimeout(()=>q.focus(),20);
  q.addEventListener("input",()=>draw(q.value));
  dlg.el.addEventListener("click",e=>{if(e.target.closest("[data-b]")){dlg.close();return}const mi=e.target.closest(".mi[data-n]");if(mi){dlg.close();compareDialog([name,mi.dataset.n])}});
  dlg.el.addEventListener("keydown",e=>{if(e.key==="Enter"){const mi=e.target.closest(".mi[data-n]")||dlg.el.querySelector(".mi[data-n]");if(mi){e.preventDefault();mi.click()}}});
}
function compareDialog(names){
  names=names.slice(0,4);
  const dlg=openDialog(`<header><div><h3>${esc(t("cmp.title"))}</h3><p class="muted" id="cmpSum">${esc(t("cmp.loading"))}</p></div><button class="icon ghost" data-b="cancel">${IC.x}</button></header><div class="dbody"><div class="cmp-tools"><input id="cmpQ" type="search" placeholder="${esc(t("cmp.filter"))}"></div><div id="cmpBody"><div class="loading" style="height:120px"><div class="spin"></div></div></div></div>`,"wide");
  CMP={kind:S.kind,names,result:null,dlg};
  dlg.el.addEventListener("click",e=>{if(e.target.closest("[data-b]"))dlg.close()});
  dlg.el.querySelector("#cmpQ").addEventListener("input",drawCompare);
  send("compare",{kind:S.kind,names});
}
function drawCompare(){
  if(!CMP||!CMP.result||!document.body.contains(CMP.dlg.scrim))return;
  const r=CMP.result,el=CMP.dlg.el,by=new Map((DATA.kinds[CMP.kind]||[]).map(p=>[p.name,p]));
  const cols=CMP.names.map(n=>by.get(n)||{name:n,label:n,kind:CMP.kind,facts:{}});
  el.querySelector("#cmpSum").textContent=(r.rows.length?plural("cmp.diff",r.rows.length):t("cmp.none"))+" · "+t("cmp.same",{n:r.same})+(r.truncated?" · "+t("cmp.truncated"):"");
  const q=lower(el.querySelector("#cmpQ").value.trim());
  const rows=r.rows.filter(x=>!q||lower(x.key).includes(q)||x.values.some(v=>lower(v).includes(q)));
  const head=`<thead><tr><th>${esc(t("dups.setting"))}</th>${cols.map(p=>`<th title="${esc(p.label)}"><span class="h">${p.kind==="filament"&&p.facts.color?`<span class="sw" style="--sw:${esc(p.facts.color.slice(0,7))}"></span>`:""}${esc(p.label)}</span></th>`).join("")}</tr></thead>`;
  el.querySelector("#cmpBody").innerHTML=r.rows.length?`<div class="cmp"><table>${head}<tbody>${rows.map(x=>`<tr><td class="k" title="${esc(x.key)}">${esc(x.key)}</td>${x.values.map(v=>`<td class="${v?"":"empty"}" title="${esc(v)}">${esc(v||"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:emptyState(t("cmp.none"),"","",ART_OK);
}
/* Export and import of the plugin's settings. */
function exportDialog(){
  const text=JSON.stringify(exportConfig(CFG,DATA?DATA.version:"",new Date().toISOString().slice(0,10)),null,1);
  const sum=importSummary(JSON.parse(text));
  const dlg=openDialog(`<header><div><h3>${esc(t("io.export"))}</h3><p class="muted">${esc(t("io.export_text"))}</p></div><button class="icon ghost" data-b="cancel">${IC.x}</button></header><div class="dbody"><textarea class="code" id="ioText" readonly>${esc(text)}</textarea>${summaryHtml(sum)}</div><div class="btns"><button class="ghost" data-b="cancel">${esc(t("btn.cancel"))}</button><button data-b="file">${IC.download}${esc(t("io.save"))}</button><button class="primary" data-b="copy">${IC.copy}${esc(t("io.copy"))}</button></div>`,"wide mid");
  dlg.el.addEventListener("click",e=>{
    const b=e.target.closest("[data-b]");if(!b)return;
    if(b.dataset.b==="cancel"){dlg.close();return}
    if(b.dataset.b==="copy")copyText(dlg.el.querySelector("#ioText"));
    if(b.dataset.b==="file"){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download="preset-groups-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}catch(err){toast(t("io.save_failed"),"warn")}}
  });
}
function summaryHtml(sum,bad){return `<div class="summary ${bad?"bad":""}"><span>${esc(t("io.s_groups",{n:sum.groups}))}</span><span>${esc(t("io.s_fav",{n:sum.favorites}))}</span><span>${esc(t("io.s_notes",{n:sum.notes}))}</span><span>${esc(t("io.s_hidden",{n:sum.hidden}))}</span></div>`}
function copyText(area){
  const done=()=>toast(t("io.copied"),"ok");
  const fallback=()=>{area.focus();area.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ok?done():toast(t("io.copy_failed"),"warn")};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(area.value).then(done,fallback);else fallback();
}
function importDialog(){
  const dlg=openDialog(`<header><div><h3>${esc(t("io.import"))}</h3><p class="muted">${esc(t("io.import_text"))}</p></div><button class="icon ghost" data-b="cancel">${IC.x}</button></header><div class="dbody"><div style="display:flex;gap:8px;margin-bottom:10px"><button data-b="pick">${IC.upload}${esc(t("io.pick"))}</button><input type="file" id="ioFile" accept=".json,application/json" hidden></div><textarea class="code" id="ioText" placeholder="${esc(t("io.paste_ph"))}"></textarea><div id="ioSum"></div></div><div class="btns"><button class="ghost" data-b="cancel">${esc(t("btn.cancel"))}</button><button data-b="replace" disabled>${esc(t("io.replace"))}</button><button class="primary" data-b="merge" disabled>${esc(t("io.merge"))}</button></div>`,"wide mid");
  const area=dlg.el.querySelector("#ioText");let parsed=null;
  const check=()=>{
    parsed=null;const text=area.value.trim(),out=dlg.el.querySelector("#ioSum");
    if(text){try{parsed=parseImport(text);out.innerHTML=summaryHtml(importSummary(parsed))}catch(e){out.innerHTML=`<div class="summary bad"><span>${esc(t("io.bad"))}</span></div>`}}else out.innerHTML="";
    dlg.el.querySelectorAll("[data-b=merge],[data-b=replace]").forEach(b=>b.disabled=!parsed);
  };
  area.addEventListener("input",check);
  dlg.el.querySelector("#ioFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{area.value=String(r.result||"");check()};r.readAsText(f)});
  dlg.el.addEventListener("click",e=>{
    const b=e.target.closest("[data-b]");if(!b)return;
    if(b.dataset.b==="cancel"){dlg.close();return}
    if(b.dataset.b==="pick"){dlg.el.querySelector("#ioFile").click();return}
    if(!parsed)return;
    CFG=mergeImport(CFG,parsed,b.dataset.b);
    if(parsed.favorites_first!==undefined&&b.dataset.b==="replace")CFG.favorites_first=!!parsed.favorites_first;
    saveNow({refresh:true});dlg.close();toast(t("msg.imported"),"ok");
  });
}
function settingsMenu(anchor){
  const lang=["auto","ru","en"].map(l=>`<div class="mi ${CFG.language===l?"cur":""}" tabindex="0" data-l="${l}"><span class="grow">${esc(t("lang."+l))}</span>${CFG.language===l?IC.check:""}</div>`).join("");
  const themes=`<div class="themes">${Object.entries(THEMES).map(([k,c])=>`<div class="mi ${CFG.theme===k?"cur":""}" tabindex="0" data-theme="${k}"><span class="prev"><i style="background:${c[0]}"></i><i style="background:${c[1]}"></i><i style="background:${c[2]}"></i></span>${esc(t("theme."+k))}</div>`).join("")}</div>`;
  const fav=`<div class="mi toggle" tabindex="0" data-o="fav"><span class="grow">${esc(t("set.favorites_first"))}</span>${CFG.favorites_first?`<span class="on">${IC.check}</span>`:""}</div>`;
  const io=`<div class="mi" tabindex="0" data-o="export">${IC.download}<span class="grow">${esc(t("io.export"))}…</span></div><div class="mi" tabindex="0" data-o="import">${IC.upload}<span class="grow">${esc(t("io.import"))}…</span></div>`;
  pop(anchor,`<div class="ttl">${esc(t("set.theme"))}</div>${themes}<div class="ttl">${esc(t("set.language"))}</div>${lang}<hr>${fav}<hr><div class="ttl">${esc(t("set.backup"))}</div>${io}<hr><div class="mi muted" style="cursor:default;white-space:normal;height:auto;padding:6px 10px">${esc(t("set.about",{version:DATA?DATA.version:""}))}</div>`,
  d=>{
    if(d.l){CFG.language=d.l;saveNow({reload:true})}
    else if(d.theme){CFG.theme=d.theme;applyTheme(d.theme);persistUi();save()}
    else if(d.o==="fav"){CFG.favorites_first=!CFG.favorites_first;save();render()}
    else if(d.o==="export")exportDialog();
    else if(d.o==="import")importDialog();
  },"settings");
}
function toast(text,level="ok",undo){
  const el=document.createElement("div");el.className="toast "+level;
  el.innerHTML=`${level==="ok"?IC.ok:level==="error"?IC.warn:IC.info}<span>${esc(text)}</span>`;
  if(typeof undo==="function"){const b=document.createElement("button");b.className="sm ghost";b.textContent=t("btn.undo");b.onclick=()=>{undo();el.remove()};el.appendChild(b)}
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),level==="error"?8000:4200);
}

/* ---------- selection & events ---------- */
function rowNames(){return [...document.querySelectorAll("#content .row[data-name]")].map(r=>r.dataset.name)}
function toggleSel(name,e){
  if(e&&e.shiftKey&&S.anchor){const all=rowNames(),a=all.indexOf(S.anchor),b=all.indexOf(name);if(a>=0&&b>=0){for(const n of all.slice(Math.min(a,b),Math.max(a,b)+1))S.sel.add(n);render();return}}
  S.sel.has(name)?S.sel.delete(name):S.sel.add(name);S.anchor=name;render();
}
document.addEventListener("click",e=>{
  if(e.target.closest(".scrim"))return;
  if(popEl&&!e.target.closest(".pop"))closePop();
  const k=e.target.closest("[data-kind]");if(k){S.kind=k.dataset.kind;S.sel.clear();closeDrawer();persistUi();render();return}
  if(e.target.closest("#addGroup,#addGroup2")){groupDialog(null,S.sel.size?[...S.sel]:null);return}
  const gm=e.target.closest("[data-gmenu]");if(gm){e.stopPropagation();groupActions(gm,gm.dataset.gmenu);return}
  const nav=e.target.closest(".nav[data-view]");if(nav){S.view=nav.dataset.view;persistUi();render();$("#content").scrollTop=0;return}
  const col=e.target.closest("[data-collapse]");if(col){const g=groups().find(x=>x.id===col.dataset.collapse);if(g){g.collapsed=!g.collapsed;save();render()}return}
  const sb=e.target.closest("[data-sel]");if(sb){const names=[...S.sel],a=sb.dataset.sel;
    if(a==="clear"){S.sel.clear();render()}else if(a==="group")groupMenu(sb,names);else if(a==="ungroup")assign(names,null);
    else if(a==="slots")slotsDialog(sorted(presets().filter(p=>S.sel.has(p.name))).map(p=>p.name),"");
    else if(a==="compare"){if(names.length>=2&&names.length<=4)compareDialog(names)}
    else setHidden(names,a==="hide");return}
  const act=e.target.closest("[data-act]");
  if(act){
    const a=act.dataset.act,rowEl=act.closest("[data-name]"),name=rowEl?rowEl.dataset.name:null;
    if(a==="close"){closeDrawer();return}
    if(a==="showall"){S.printer="all";persistUi();render();return}
    if(a==="seenall"){markAllSeen();return}
    if(a==="gslots"||a==="gedit"){const g=groups().find(x=>x.id===S.view);if(g)a==="gslots"?slotsForGroup(g):groupDialog(g);return}
    if(a==="check"){toggleSel(name,e);return}
    if(a==="slot"){slotMenu(act,name);return}
    if(a==="select"){send("apply",{kind:S.kind,name});return}
    if(a==="fav"){toggleFav(name);return}
    if(a==="cmpwith"){comparePicker(name);return}
    if(a==="group"){groupMenu(act,S.sel.has(name)&&S.sel.size>1?[...S.sel]:[name]);return}
    if(a==="more"){moreMenu(act,name);return}
    if(a==="hide"||a==="unhide"){setHidden([name],a==="hide");return}
    if(a==="keep"){const c=act.closest("[data-cluster]").dataset.cluster.split("\n");setHidden(c.filter(n=>n!==name),true);return}
    if(a==="cmpcluster"){compareDialog(act.closest("[data-cluster]").dataset.cluster.split("\n"));return}
    if(a==="notdup"){const key=act.closest("[data-cluster]").dataset.cluster;CFG.not_duplicates[S.kind].push(key);saveNow({refresh:true});toast(t("msg.not_dup"),"ok");return}
  }
  const r=e.target.closest("#content .row[data-name]");
  if(r&&!e.target.closest("button")){if(e.ctrlKey||e.metaKey||e.shiftKey||S.sel.size)toggleSel(r.dataset.name,e);else openDrawer(r.dataset.name)}
});
document.addEventListener("dblclick",e=>{const r=e.target.closest("#content .row[data-name]");if(r&&S.kind==="filament"&&!e.target.closest("button")){const p=presets().find(x=>x.name===r.dataset.name);if(p&&p.compatible)slotMenu(r,p.name)}});
document.addEventListener("change",e=>{
  if(e.target.id==="printerSel"){S.printer=e.target.value;persistUi();render()}
  if(e.target.id==="sortSel"){S.sort=e.target.value;persistUi();render()}
});
document.addEventListener("input",e=>{if(e.target.id==="noteBox"&&S.open)setNote(S.open,e.target.value)});
// Only the list, not the drawer: redrawing the drawer here would swallow a click on one of its buttons.
document.addEventListener("focusout",e=>{if(e.target.id==="noteBox"){MEMO=null;renderContent()}});
$("#q").addEventListener("input",e=>{S.q=e.target.value.trim();MEMO=null;renderToolbar();renderContent();renderSelbar()});
$("#refresh").addEventListener("click",()=>{send("refresh");$("#refresh").querySelector("svg").animate([{transform:"rotate(0)"},{transform:"rotate(360deg)"}],{duration:600})});
$("#settings").addEventListener("click",e=>{e.stopPropagation();if(CFG)settingsMenu($("#settings"))});
document.addEventListener("keydown",e=>{
  // Escape closes the top dialog wherever the focus is.
  const top=[...document.querySelectorAll(".scrim")].pop();
  if(top){if(e.key==="Escape")top.remove();return}
  const typing=e.target.matches&&e.target.matches("input,textarea,select");
  if(e.key==="/"&&!typing){e.preventDefault();$("#q").focus();return}
  if(e.key==="Escape"){if(popEl)closePop();else if(S.open)closeDrawer();else if(S.sel.size){S.sel.clear();render()}else if(document.activeElement===$("#q")){$("#q").value="";S.q="";render()}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a"&&!typing){e.preventDefault();rowNames().forEach(n=>S.sel.add(n));render()}
  if(e.key==="Enter"&&document.activeElement&&document.activeElement.matches(".nav[data-view]"))document.activeElement.click();
});
/* drag & drop: presets onto groups, groups to reorder */
let drag=null;
document.addEventListener("dragstart",e=>{
  const g=e.target.closest&&e.target.closest(".nav[data-group]");
  if(g){drag={type:"group",id:g.dataset.group};g.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","group");return}
  const r=e.target.closest&&e.target.closest(".row[data-name]");if(!r)return;
  const names=S.sel.has(r.dataset.name)?[...S.sel]:[r.dataset.name];
  drag={type:"presets",names};e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",names.join("\n"));
  const ghost=document.createElement("div");ghost.style.cssText="position:fixed;top:-100px;padding:6px 12px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font:600 12px var(--orca-font,system-ui)";ghost.textContent=plural("n.presets",names.length);document.body.appendChild(ghost);e.dataTransfer.setDragImage(ghost,10,10);setTimeout(()=>ghost.remove(),0);
  requestAnimationFrame(()=>names.forEach(n=>{const el=document.querySelector(`.row[data-name="${CSS.escape(n)}"]`);if(el)el.classList.add("dragging")}));
});
function dropTarget(e){return e.target.closest&&e.target.closest("[data-drop]")}
document.addEventListener("dragover",e=>{
  if(!drag)return;const tgt=dropTarget(e);
  document.querySelectorAll(".drop,.drag-over-top").forEach(x=>x.classList.remove("drop","drag-over-top"));
  if(!tgt)return;
  if(drag.type==="group"){const n=tgt.closest(".nav[data-group]");if(n&&n.dataset.group!==drag.id){e.preventDefault();n.classList.add("drag-over-top")}return}
  e.preventDefault();(tgt.closest(".section")||tgt.closest(".nav")||tgt).classList.add("drop");
});
document.addEventListener("dragend",()=>{drag=null;document.querySelectorAll(".drop,.drag-over-top,.dragging").forEach(x=>x.classList.remove("drop","drag-over-top","dragging"))});
document.addEventListener("drop",e=>{
  if(!drag)return;const tgt=dropTarget(e);e.preventDefault();
  if(drag.type==="group"){const n=tgt&&tgt.closest(".nav[data-group]");if(n){const l=groups(),from=l.findIndex(g=>g.id===drag.id),to=l.findIndex(g=>g.id===n.dataset.group);if(from>=0&&to>=0){const [g]=l.splice(from,1);l.splice(to,0,g);save();render()}}}
  else if(tgt)assign(drag.names,tgt.dataset.drop==="none"?null:tgt.dataset.drop);
  drag=null;
});

/* ---------- messages from the plugin ---------- */
orca.onMessage(msg=>{
  const k=msg.type;
  if(k==="init"||k==="data"){
    if(msg.strings){T=msg.strings;LANG=msg.language||"en";document.documentElement.lang=LANG;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));$("#q").placeholder=t("search.placeholder")}
    if(msg.config){CFG=msg.config;applyTheme(CFG.theme);persistUi()}
    DATA=msg.data;
    initSeen();
    $("#printerName").textContent=DATA.printer?DATA.printer:t("app.no_printer");
    render();
  }else if(k==="compare"){if(CMP&&CMP.kind===msg.kind&&CMP.names.join("\n")===msg.names.join("\n")){CMP.result=msg;drawCompare()}}
  else if(k==="notice"){toast(msg.message,msg.level||"ok")}
  else if(k==="error"){toast(msg.message,"error")}
});
send("init");
</script>
</body>
